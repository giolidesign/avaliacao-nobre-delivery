/* ==========================================================
   NOBRE PIZZARIA — Avaliação pós-pedido
   Paleta extraída dos arquivos de marca:
   creme #FFF7D5 · marrom #77331E · vermelho #EA3D18
   verde #236943 · laranja #FFA640
   ========================================================== */
:root{
  --cream:    #FFF7D5;
  --cream-hi: #FFFBE8;
  --brown:    #77331E;
  --brown-dk: #5A2415;
  --red:      #EA3D18;
  --red-dk:   #DC290C;
  --green:    #236943;
  --orange:   #FFA640;

  --line: 2px solid var(--brown);
  --pop: 4px 4px 0 var(--brown);
  --pop-sm: 3px 3px 0 var(--brown);
  --r: 18px;
  --gap: clamp(16px, 4.5vw, 22px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}

body{
  background:var(--cream);
  color:var(--brown);
  font-family:'Figtree',system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;
  padding:max(18px,env(safe-area-inset-top)) 0 0;
  overflow-x:hidden;
}

.app{
  width:100%;max-width:430px;flex:1;
  display:flex;flex-direction:column;gap:var(--gap);
  padding-inline:18px;
  padding-bottom:clamp(26px,7vw,44px);   /* respiro antes da faixa */
}

/* ---------- Marca ---------- */
.brand{display:flex;justify-content:center;padding:6px 0 0}
.brand svg{width:58px;height:auto;color:var(--red-dk);display:block}

/* ---------- Cabeçalho ---------- */
.head{text-align:center}
.head h1{
  font-family:'Motter Corpus Std',Impact,sans-serif;
  font-weight:400;
  font-size:clamp(2rem,9.4vw,2.6rem);
  line-height:.98;
  letter-spacing:.01em;
  text-transform:uppercase;
}
.head h1 em{font-style:normal;color:var(--red)}
.head p{font-size:.92rem;margin-top:12px;opacity:.78;max-width:19em;margin-inline:auto}

/* ---------- Cartões ---------- */
.card{
  background:var(--cream-hi);
  border:var(--line);
  border-radius:var(--r);
  box-shadow:var(--pop);
  padding:18px 16px;
}
.eyebrow{
  display:block;text-align:center;
  font-size:.66rem;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;
  opacity:.6;margin-bottom:14px;
}

/* ---------- Unidades ---------- */
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{
  font:inherit;cursor:pointer;
  background:var(--cream);
  color:var(--brown);
  border:var(--line);
  border-radius:13px;
  padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:background .15s,color .15s,transform .1s,box-shadow .15s;
}
.unit b{font-weight:800;font-size:1rem}
.unit span{font-size:.68rem;opacity:.65;font-weight:500}
.unit:active{transform:translateY(2px)}
.unit[aria-pressed="true"]{background:var(--brown);color:var(--cream);box-shadow:inset 0 0 0 2px var(--cream-hi)}
.unit[aria-pressed="true"] span{opacity:.75}

@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.units.nudge{animation:nudge .4s ease}
.units.nudge .unit{border-color:var(--red);color:var(--red)}
.units.nudge .unit[aria-pressed="true"]{color:var(--cream)}

/* ---------- Estrelas ---------- */
.stars{display:flex;justify-content:center;gap:1px}
.star{
  background:none;border:0;cursor:pointer;padding:4px 2px;line-height:0;
  color:transparent;
  transition:color .18s ease,transform .2s cubic-bezier(.34,1.6,.64,1);
}
.star svg{width:clamp(40px,11vw,50px);height:auto;display:block;
  stroke:var(--brown);stroke-width:1.4;fill:currentColor;
  stroke-linejoin:round;vector-effect:non-scaling-stroke}
.star.on{color:var(--orange)}
.star.pop{transform:scale(1.2) rotate(-6deg)}
.star:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

.verdict{
  text-align:center;margin-top:10px;min-height:1.5em;
  font-family:'Motter Corpus Std',Impact,sans-serif;font-size:1.2rem;
  text-transform:uppercase;letter-spacing:.02em;color:var(--red);
  opacity:0;transition:opacity .22s;
}
.verdict.show{opacity:1}

/* ---------- Ações ---------- */
.acts{display:none;flex-direction:column;gap:11px}
.acts.show{display:flex;animation:rise .35s cubic-bezier(.2,.85,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.acts h2{
  font-family:'Motter Corpus Std',Impact,sans-serif;font-weight:400;
  font-size:1.5rem;line-height:1.05;text-transform:uppercase;
  text-align:center;
}
.acts .sub{text-align:center;font-size:.85rem;opacity:.75;margin:-2px 0 6px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:'Figtree',sans-serif;font-weight:800;font-size:1rem;
  text-decoration:none;color:var(--cream-hi);
  border:var(--line);border-radius:13px;
  padding:15px 16px;
  box-shadow:var(--pop-sm);
  transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--brown)}
.btn svg{width:19px;height:19px;flex:none;fill:currentColor}
.btn-google{background:var(--red)}
.btn-wa{background:var(--green)}
.btn.quiet{
  background:transparent;color:var(--brown);
  font-weight:600;font-size:.88rem;padding:12px 16px;
  box-shadow:none;border-color:rgba(119,51,30,.35);
}
.btn.quiet svg{opacity:.65}

/* ---------- Agradecimento ---------- */
.thanks{display:none;text-align:center;padding:26px 8px 10px}
.thanks.show{display:block}
.seal{width:118px;height:118px;margin:0 auto 20px;color:var(--red);
  animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{from{transform:scale(1.7) rotate(14deg);opacity:0}to{transform:none;opacity:1}}
.thanks h2{font-family:'Motter Corpus Std',Impact,sans-serif;font-weight:400;font-size:2rem;text-transform:uppercase;line-height:1}
.thanks p{font-size:.92rem;opacity:.75;margin-top:10px}

/* ---------- Rodapé verde (faixa da marca) ---------- */
.band{
  background:var(--green);color:var(--cream);
  width:100%;align-self:stretch;
  padding:15px 18px calc(15px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;justify-content:center;
  column-gap:.7em;row-gap:.25em;
  font-size:clamp(.6rem,2.7vw,.7rem);font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;line-height:1.35;
}
.band span{white-space:nowrap}
.band .sep{opacity:.5}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="band">
  <span>Nobre Restaurante e Pizzaria</span>
  <span class="sep">|</span>
  <span>Desde 2007</span>
</div>

<script>
/* ==========================================================
   CONFIGURAÇÃO — edite somente este bloco
   ========================================================== */
const CONFIG = {
  units: [
    { id:'maranguape', name:'Maranguape', area:'Centro',
      placeId:'ChIJa3PxmnyrwAcR3J70vaThipY', whatsapp:'5585981774418' },
    { id:'maracanau',  name:'Maracanaú',  area:'Jereissati',
      placeId:'ChIJOZEi5XFTxwcRB51mAQSYBWE', whatsapp:'5585981774418' }
  ],
  // URL do Apps Script (Google Planilhas). Cole aqui a URL terminada em /exec.
  // Deixe como '' (vazio) para desativar o registro.
  webhookUrl: 'https://script.google.com/macros/s/AKfycbxShfcAiqG8R6oO3_ngXoOilVVXlV2HhKuNRe9XA_Ut5zMGpMMCX0OhhSY951t1fatL6Q/exec'
};

const VERDICTS = {1:'Sentimos muito.',2:'Ficou devendo.',3:'Dá pra melhorar.',4:'Que bom!',5:'Que alegria!'};
const state = { unit:null, rating:0, sent:false };

const $units=document.getElementById('units');
const $stars=document.getElementById('stars');
const $verdict=document.getElementById('verdict');
const $acts=document.getElementById('acts');

/* --- Selo serrilhado (gerado, no espírito do selo do banner) --- */
(function seal(){
  const pts=[], N=26, cx=50, cy=50;
  for(let i=0;i<N*2;i++){
    const r = i%2 ? 41 : 48.5;
    const a = (Math.PI*2/(N*2))*i - Math.PI/2;
    pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]);
  }
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ')+' Z';
  document.getElementById('sealPath').setAttribute('d', d);
})();

/* --- Unidades --- */
CONFIG.units.forEach(u=>{
  const b=document.createElement('button');
  b.type='button'; b.className='unit'; b.dataset.id=u.id;
  b.setAttribute('aria-pressed','false');
  b.innerHTML=`<b>${u.name}</b><span>${u.area}</span>`;
  b.addEventListener('click',()=>selectUnit(u.id));
  $units.appendChild(b);
});

function selectUnit(id){
  state.unit=CONFIG.units.find(u=>u.id===id);
  [...$units.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));
  reveal();
}

const preset=new URLSearchParams(location.search).get('u');
if(preset && CONFIG.units.some(u=>u.id===preset)) selectUnit(preset);

/* --- Estrelas --- */
const STAR='M12 2.1l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L12 17.12l-5.88 3.09 1.12-6.55L2.48 9.02l6.58-.96z';

for(let i=1;i<=5;i++){
  const b=document.createElement('button');
  b.type='button'; b.className='star'; b.setAttribute('role','radio');
  b.setAttribute('aria-checked','false');
  b.setAttribute('aria-label',`${i} ${i===1?'estrela':'estrelas'}`);
  b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR}"/></svg>`;
  b.addEventListener('click',()=>setRating(i));
  $stars.appendChild(b);
}

function setRating(n){
  state.rating=n;
  [...$stars.children].forEach((s,idx)=>{
    const on=idx<n;
    s.classList.toggle('on',on);
    s.setAttribute('aria-checked',String(idx===n-1));
    if(on){
      s.classList.remove('pop'); void s.offsetWidth;
      setTimeout(()=>s.classList.add('pop'), idx*45);
      setTimeout(()=>s.classList.remove('pop'), idx*45+200);
    }
  });
  buzz(n);
  $verdict.textContent=VERDICTS[n];
  $verdict.classList.add('show');

  if(!state.unit){
    $units.classList.remove('nudge'); void $units.offsetWidth;
    $units.classList.add('nudge');
    setTimeout(()=>$units.classList.remove('nudge'),480);
  }
  reveal();
}

/* --- Retorno tátil: um toque curto por estrela, no ritmo da animação --- */
function buzz(n){
  if(!navigator.vibrate) return;              // iOS não expõe a API
  const pattern=[];
  for(let i=0;i<n;i++){ pattern.push(11); if(i<n-1) pattern.push(34); }
  try{ navigator.vibrate(pattern); }catch(e){}
}

/* --- Painel de ações --- */
function reveal(){
  if(!state.unit||!state.rating) return;
  const happy=state.rating>=4, u=state.unit;

  document.getElementById('actTitle').textContent = happy ? 'Conta pra mais gente?' : 'Deixa a gente resolver';
  document.getElementById('actSub').textContent = happy
    ? 'Sua avaliação no Google ajuda quem não nos conhece.'
    : 'Fale direto com nossa equipe. A gente responde rápido.';

  const gUrl=`https://search.google.com/local/writereview?placeid=${u.placeId}`;
  const msg=`Olá! Avaliei minha experiência na unidade ${u.name} com ${state.rating} ${state.rating===1?'estrela':'estrelas'}. Gostaria de comentar:`;
  const wUrl=`https://wa.me/${u.whatsapp}?text=${encodeURIComponent(msg)}`;

  const g=`<a class="btn ${happy?'btn-google':'quiet'}" href="${gUrl}" target="_blank" rel="noopener" data-go="google">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR}"/></svg>Avaliar no Google</a>`;
  const w=`<a class="btn ${happy?'quiet':'btn-wa'}" href="${wUrl}" target="_blank" rel="noopener" data-go="whatsapp">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15.05L2 22l5.1-1.33A10 10 0 1012 2zm0 1.9a8.1 8.1 0 11-4.13 15.07l-.3-.18-3.02.79.8-2.95-.19-.31A8.1 8.1 0 0112 3.9zm4.5 10.2c-.24-.12-1.44-.71-1.66-.79-.22-.08-.38-.12-.55.12s-.63.79-.77.95c-.14.16-.28.18-.52.06a6.6 6.6 0 01-3.3-2.88c-.25-.43.25-.4.71-1.32.08-.16.04-.3-.02-.42s-.55-1.32-.75-1.81c-.2-.47-.4-.4-.55-.41h-.47a.9.9 0 00-.65.3 2.73 2.73 0 00-.85 2.03 4.75 4.75 0 001 2.52 10.86 10.86 0 004.16 3.67c1.55.6 2.16.65 2.94.55.47-.07 1.44-.59 1.65-1.16s.2-1.06.14-1.16-.22-.16-.46-.28z"/></svg>Falar com a gente</a>`;

  document.getElementById('actBtns').innerHTML = happy ? g+w : w+g;

  document.querySelectorAll('#actBtns .btn').forEach(a=>{
    a.addEventListener('click',()=>{
      send(a.dataset.go);
      setTimeout(()=>{
        document.getElementById('form').style.display='none';
        document.getElementById('thanks').classList.add('show');
      },600);
    });
  });

  $acts.classList.add('show');
  setTimeout(()=>$acts.scrollIntoView({behavior:'smooth',block:'end'}),60);
}

/* --- Registro + aviso à equipe --- */
function send(destination){
  const url = CONFIG.webhookUrl;
  if(state.sent || !url || url.indexOf('http') !== 0) return;
  state.sent=true;
  const payload={
    unidade:state.unit.name, unidadeId:state.unit.id,
    nota:state.rating, destino:destination,
    criticaEm:state.rating<=3,
    quando:new Date().toISOString()
  };
  try{
    /* text/plain evita o "preflight" do navegador, que o Apps Script rejeita.
       O conteúdo continua sendo JSON e chega inteiro em e.postData.contents. */
    const json=JSON.stringify(payload);
    const body=new Blob([json],{type:'text/plain;charset=utf-8'});
    if(navigator.sendBeacon && navigator.sendBeacon(url,body)) return;
    fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:json,keepalive:true});
  }catch(e){}
}
</script>
</body>
</html>
